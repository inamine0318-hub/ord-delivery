<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORD - Okinawa Resort Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#123a37;
    --teal:#1c5b55;
    --teal-light:#2f7d76;
    --cream:#fbf8f1;
    --cream-2:#f3ecdd;
    --coral:#e8603f;
    --coral-dark:#d14c30;
    --mint-bg:#dcefe7;
    --mint-text:#1c7a5e;
    --peach-bg:#fbe1d8;
    --peach-text:#c65a3a;
    --text:#1c2b28;
    --text-soft:#647672;
    --border:#e7e0cf;
    --radius:16px;
    --shadow-card:0 6px 20px rgba(20,50,45,.08);
    --shadow-lift:0 14px 34px rgba(20,50,45,.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter','Hiragino Sans','Yu Gothic',sans-serif;
    background:var(--cream); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Poppins','Hiragino Sans','Yu Gothic',sans-serif;}
  .script{font-family:'Caveat',cursive;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%; display:block;}
  svg{display:block;}

  /* ---------- Header ---------- */
  header.site-header{
    position:sticky; top:0; z-index:50; background:#fff;
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1240px; margin:0 auto; padding:12px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo-icon{width:34px; height:34px; flex:0 0 auto;}
  .logo-text{font-family:'Poppins',sans-serif; font-weight:800; color:var(--teal-dark); font-size:22px; line-height:1;}
  .logo-stack{display:flex; flex-direction:column; gap:2px;}
  .logo-sub{font-size:9px; font-weight:700; letter-spacing:1.4px; color:var(--text-soft);}
  .logo-tagline{font-family:'Caveat',cursive; font-size:15px; color:var(--teal); font-weight:700; margin-top:-2px;}
  nav.main-nav{display:flex; gap:22px; font-size:14px; font-weight:600; color:var(--teal-dark);}
  nav.main-nav a{padding:4px 0; border-bottom:2px solid transparent;}
  nav.main-nav a.active{border-color:var(--coral);}
  .header-actions{display:flex; align-items:center; gap:14px;}
  .lang-switch{font-size:13px; font-weight:700; border:1px solid var(--border); border-radius:20px; padding:7px 14px; background:#fff; display:flex; align-items:center; gap:6px; color:var(--teal-dark);}
  .cart-btn{position:relative; background:none; border:none; color:var(--teal-dark); padding:4px;}
  .cart-badge{
    position:absolute; top:-4px; right:-6px; background:var(--coral); color:#fff;
    font-size:10px; font-weight:800; border-radius:10px; min-width:17px; height:17px;
    display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid #fff;
  }
  .hamburger{
    display:none; background:none; border:none; color:var(--teal-dark);
    width:40px; height:40px; align-items:center; justify-content:center; border-radius:8px; flex:0 0 auto;
  }
  .hamburger:active{background:var(--cream-2);}

  @media (max-width: 900px){
    nav.main-nav{display:none;}
    .hamburger{display:flex;}
  }

  /* ---------- Mobile nav drawer（既存カートドロワーの.drawer/.drawer-overlay/.drawer-closeを流用） ---------- */
  .mobile-nav-item{
    display:flex; align-items:center; min-height:50px; padding:0 4px; font-family:'Poppins',sans-serif;
    font-size:16px; font-weight:700; color:var(--teal-dark); border-bottom:1px solid var(--border);
  }

  /* ---------- Hero（社長提供の完成グラフィックをそのまま使用） ---------- */
  /* 【2026-09-24・社長承認】hero-home.jpg内に焼き込まれた「15:00締切バッジ」「18:00-21:00表示」は
     写真そのものを加工せず、同じ位置に不透明な実HTML要素を重ねて視覚的に置き換える
     （画像の該当ピクセルは既に元の背景が失われており、自然な除去による復元ができないため）。
     .hero-wrapの縦横比を画像と完全に一致させることで、どの画面幅でも重なる位置がずれない。 */
  /* 【2026-09-24・実装時判明】badge単独＋delivery-time単独の2ボックス構成では、モバイル幅
     （画像の縦幅が非常に小さくなる）で両者が重なってしまうことを実機相当テストで確認したため、
     1枚のクリック可能なカードに統合した（締切バッジと配達時間を分離しない）。 */
  .hero-wrap{position:relative; width:100%; aspect-ratio:1672/941; overflow:hidden; background:var(--teal-dark);}
  .hero-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-cutoff-badge{
    position:absolute; left:4.1%; top:63%; width:40%; min-height:clamp(55px,14.5vw,220px);
    background:linear-gradient(135deg,#fbe4de,#f7d3ca); border-radius:14px;
    display:flex; align-items:center; gap:8px; padding:6px 10px;
    cursor:pointer; border:none; text-align:left; box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .hero-cutoff-badge:active{transform:scale(.98);}
  .hero-cutoff-badge .clock-ic{color:#b23b2e; flex:0 0 auto; width:clamp(14px,2.2vw,22px); height:clamp(14px,2.2vw,22px);}
  .hero-cutoff-badge .clock-ic svg{width:100%; height:100%; display:block;}
  .hero-cutoff-badge .txt{flex:1 1 auto; min-width:0;}
  .hero-cutoff-badge .txt .en{display:block; font-size:clamp(8.5px,1.7vw,15px); font-weight:800; color:#8a2f22; line-height:1.1;}
  .hero-cutoff-badge .txt .ja{display:block; font-size:clamp(7px,1.2vw,11.5px); font-weight:700; color:#b23b2e; line-height:1.1; margin-top:2px;}
  .hero-cutoff-badge .txt .delivery-line{display:block; font-size:clamp(6.5px,1.1vw,10.5px); font-weight:700; color:var(--teal-dark); margin-top:3px; padding-top:2px; border-top:1px solid rgba(178,59,46,.25); line-height:1.15;}
  .hero-cutoff-badge .arrow-ic{color:#fff; background:var(--coral-dark); border-radius:50%; width:clamp(14px,2.4vw,26px); height:clamp(14px,2.4vw,26px); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .hero-cutoff-badge .arrow-ic svg{width:55%; height:55%;}
  @media (max-width:340px){ .hero-cutoff-badge{width:52%;} }
  .badge-item{display:flex; flex-direction:column; align-items:center; gap:7px; width:88px; text-align:center;}
  .badge-circle{
    width:48px; height:48px; border-radius:50%; border:1.5px solid rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .badge-item span{font-size:11.5px; font-weight:700; color:#fff; line-height:1.3;}

  /* ---------- Story section（トップページ：旅行者の一日のストーリー） ---------- */
  /* 【2026-09-24・社長承認】商品一覧が過度に下へ移動しないよう、4ブロックを横並びの
     コンパクトなグリッドにまとめる（フルスクリーンのストーリーセクションにはしない）。 */
  .story-section{max-width:1240px; margin:0 auto; padding:30px 20px 6px;}
  .story-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .story-item{background:var(--cream-2); border-radius:14px; padding:16px 14px; text-align:center;}
  .story-item .num{font-family:'Poppins',sans-serif; font-weight:800; font-size:12px; color:var(--coral-dark); letter-spacing:1px;}
  .story-item .en{font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; color:var(--teal-dark); margin-top:4px; line-height:1.3;}
  .story-item .ja{font-size:12px; color:var(--text-soft); margin-top:4px; line-height:1.4; font-weight:600;}
  .story-item .detail{font-size:11.5px; color:var(--text-soft); margin-top:6px; line-height:1.5;}
  @media (max-width:760px){
    .story-grid{grid-template-columns:1fr 1fr; gap:10px;}
    .story-item{padding:14px 10px;}
  }

  /* ---------- 情報ページ（ご注文・お届けについて／利用規約／プライバシー等） ---------- */
  .info-hero{background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:#fff; padding:44px 20px;}
  .info-hero-inner{max-width:900px; margin:0 auto; text-align:center;}
  .info-hero-inner .kicker{font-family:'Poppins',sans-serif; font-weight:800; font-size:12px; letter-spacing:2px; color:#ffe3c9;}
  .info-hero-inner h1{font-family:'Poppins',sans-serif; font-size:clamp(24px,4vw,34px); margin:8px 0 4px; font-weight:800;}
  .info-hero-inner .ja{font-size:14px; color:#dcece8; margin-bottom:14px;}
  .info-hero-inner p{font-size:15px; line-height:1.7; color:#eaf3f1;}
  .info-hero-inner p.ja-body{font-size:13px; color:#cfe4df; margin-top:6px;}

  .how-it-works{max-width:1000px; margin:0 auto; padding:34px 20px 10px;}
  .how-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px;}
  .how-step{background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 14px; text-align:center;}
  .how-step .step-no{width:30px; height:30px; border-radius:50%; background:var(--teal); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:13px;}
  .how-step .en{font-weight:800; font-size:13.5px; color:var(--teal-dark); line-height:1.35;}
  .how-step .ja{font-size:11.5px; color:var(--text-soft); margin-top:3px;}
  @media (max-width:700px){ .how-grid{grid-template-columns:1fr 1fr;} }

  .info-section{max-width:900px; margin:0 auto; padding:26px 20px;}
  .info-section h2{font-family:'Poppins',sans-serif; font-size:19px; color:var(--teal-dark); font-weight:800; margin:0 0 2px;}
  .info-section h2 .ja{display:block; font-size:12.5px; color:var(--text-soft); font-weight:700; margin-top:2px;}
  .info-card{background:var(--cream); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-top:14px;}
  .info-card + .info-card{margin-top:12px;}
  .info-card p{font-size:14px; line-height:1.75; color:var(--text-main); margin:0 0 8px;}
  .info-card p:last-child{margin-bottom:0;}
  .info-card p.ja{font-size:12.5px; color:var(--text-soft); margin-top:-4px;}
  .info-card h3{font-size:14.5px; color:var(--teal-dark); font-weight:800; margin:0 0 6px;}
  .info-card h3 .ja{display:block; font-size:11.5px; color:var(--text-soft); font-weight:700; margin-top:2px;}

  .fee-table{width:100%; border-collapse:collapse; margin-top:6px; font-size:13.5px;}
  .fee-table th,.fee-table td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--border);}
  .fee-table th{background:var(--cream-2); color:var(--teal-dark); font-weight:800; font-size:12.5px;}
  .fee-table td{color:var(--text-main);}

  .policy-list{counter-reset:policy;}
  .policy-item{counter-increment:policy; background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px; position:relative; padding-left:52px;}
  .policy-item::before{
    content:counter(policy); position:absolute; left:14px; top:16px; width:26px; height:26px; border-radius:50%;
    background:var(--teal); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .policy-item h3{font-size:14px; color:var(--teal-dark); font-weight:800; margin:0 0 6px;}
  .policy-item h3 .ja{display:block; font-size:11.5px; color:var(--text-soft); font-weight:700; margin-top:2px;}
  .policy-item p{font-size:13.5px; line-height:1.7; color:var(--text-main); margin:0 0 6px;}
  .policy-item p.ja{font-size:12px; color:var(--text-soft); margin-top:-2px;}

  .commerce-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .commerce-table th,.commerce-table td{padding:12px 10px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top;}
  .commerce-table th{width:34%; color:var(--teal-dark); font-weight:800; font-size:13px;}
  .commerce-table th .ja{display:block; font-size:11px; color:var(--text-soft); font-weight:700;}
  .commerce-table td{color:var(--text-main); line-height:1.6;}

  .contact-box{background:var(--cream); border:1px solid var(--border); border-radius:14px; padding:24px; text-align:center;}
  .contact-box .email{font-size:19px; font-weight:800; color:var(--teal-dark); margin:8px 0 18px; word-break:break-all;}

  /* ---------- Sections ---------- */
  .section{max-width:1240px; margin:0 auto; padding:38px 20px;}
  .section h2{font-size:23px; color:var(--teal-dark); margin:0 0 2px; font-weight:800;}
  .section .sub-jp{font-size:13px; color:var(--text-soft); margin:0 0 20px; font-weight:600;}
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .view-all{font-size:13px; font-weight:700; color:var(--teal); white-space:nowrap; display:flex; align-items:center; gap:4px;}

  .content-with-cart{max-width:1240px; margin:0 auto; padding:0 20px 40px; display:grid; grid-template-columns:1fr; gap:26px;}
  @media (min-width:1040px){ .content-with-cart{grid-template-columns:1fr 320px;} }
  .main-col{min-width:0;}

  /* Category strip */
  .cat-strip{display:flex; gap:18px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch;}
  .cat-item{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; width:78px;}
  .cat-icon{
    width:58px; height:58px; border-radius:50%; background:var(--cream-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--teal);
  }
  .cat-icon img{width:100%; height:100%; object-fit:cover;}
  .cat-item.active .cat-icon{box-shadow:0 0 0 2px var(--teal), 0 0 0 5px rgba(28,91,85,.12);}
  .cat-item.active.all .cat-icon{background:var(--teal); color:#fff;}
  .cat-item span{font-size:11.5px; font-weight:700; text-align:center; color:var(--teal-dark);}

  /* Cards grid */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px;}
  .store-card, .product-card{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; box-shadow:var(--shadow-card); transition:box-shadow .15s, transform .15s;
  }
  .store-card:hover, .product-card:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
  .card-media{aspect-ratio:4/3; background:var(--cream-2); position:relative;}
  .card-media img{width:100%; height:100%; object-fit:cover;}
  .no-photo{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--teal); background:linear-gradient(150deg,var(--cream-2),#ece2cb);
    text-align:center; padding:10px;
  }
  .no-photo .cat-tag{font-size:10px; font-weight:800; letter-spacing:1.2px; color:var(--teal); text-transform:uppercase;}
  .no-photo svg{opacity:.55;}
  .store-logo-badge{
    position:absolute; left:14px; bottom:-20px; width:44px; height:44px; border-radius:50%;
    background:#fff; border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:18px;
  }
  .store-logo-badge img{width:100%; height:100%; object-fit:cover;}
  .card-body{padding:28px 16px 16px; display:flex; flex-direction:column; gap:7px; flex:1;}
  .store-card .card-body{padding-top:16px;}
  .card-body h3{margin:0; font-size:15.5px; font-weight:800; color:var(--teal-dark);}
  .card-body .genre{font-size:12px; color:var(--text-soft); margin-top:-4px; font-weight:600;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;}
  .tag.mint{background:var(--mint-bg); color:var(--mint-text);}
  .tag.peach{background:var(--peach-bg); color:var(--peach-text);}
  .price-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}
  .price{font-weight:800; color:var(--text); font-size:15px;}
  .add-btn{
    width:34px; height:34px; border-radius:50%; background:var(--teal); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .add-btn:hover{background:var(--teal-light);}
  .store-card{cursor:pointer;}
  .card-chevron{position:absolute; right:12px; bottom:12px; color:#fff; background:rgba(0,0,0,.28); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center;}

  /* Cart panel */
  .cart-panel{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px;
    box-shadow:var(--shadow-card); align-self:start; position:sticky; top:88px;
  }
  .cart-panel h3{margin:0 0 12px; font-size:16px; font-weight:800; color:var(--teal-dark); display:flex; justify-content:space-between; align-items:center;}
  .cart-panel h3 .edit-link{font-size:12px; font-weight:700; color:var(--teal); cursor:pointer;}
  .cart-empty{font-size:13px; color:var(--text-soft); padding:10px 0;}
  .cart-line{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .cart-line img{width:46px; height:46px; border-radius:8px; object-fit:cover; flex:0 0 auto;}
  .cart-line-info{flex:1; min-width:0;}
  .cart-line-info .name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cart-line-info .price{font-size:12.5px; color:var(--text-soft); font-weight:700;}
  .cart-line-options{font-size:11.5px; color:var(--teal); font-weight:600; margin:1px 0;}
  .cart-line-remove{background:none; border:none; color:var(--text-soft); font-size:13px; flex:0 0 auto;}
  .cart-subtotal{display:flex; justify-content:space-between; align-items:center; padding:14px 0 6px; font-weight:800; font-size:15px;}
  .cart-checkout-btn{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:10px; padding:13px; font-weight:800;
    font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;
  }
  .cart-delivery-note{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-soft); margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  .cart-cutoff-note{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--teal); font-weight:700; margin-top:8px;}
  .cart-cutoff-note.past{color:var(--coral-dark);}

  .mobile-cart-fab{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:80;
    background:var(--teal-dark); color:#fff; border:none; border-radius:28px; padding:13px 22px;
    font-weight:800; font-size:14px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 26px rgba(0,0,0,.28);
  }
  @media (min-width:1040px){ .mobile-cart-fab{display:none;} }

  .drawer-overlay{position:fixed; inset:0; background:rgba(10,25,23,.45); z-index:90;}
  .drawer{position:fixed; right:0; top:0; bottom:0; width:min(360px,88vw); background:#fff; z-index:91; padding:18px; overflow-y:auto; box-shadow:-8px 0 24px rgba(0,0,0,.2);}
  .drawer-close{background:none; border:none; float:right; color:var(--text-soft);}

  /* Product detail */
  .detail-back{display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--teal); margin-bottom:16px; background:none; border:none; font-size:14px;}
  .detail-layout{display:grid; grid-template-columns:1fr; gap:26px;}
  @media (min-width:760px){ .detail-layout{grid-template-columns:1fr 1fr;} }
  .detail-media{aspect-ratio:4/3; border-radius:var(--radius); overflow:hidden; background:var(--cream-2); box-shadow:var(--shadow-card);}
  .detail-media img{width:100%; height:100%; object-fit:cover;}
  .detail-info h1{font-size:25px; margin:0 0 2px; color:var(--teal-dark); font-weight:800;}
  .detail-info .en{color:var(--text-soft); font-size:14px; margin-bottom:10px; font-weight:600;}
  .detail-price{font-size:23px; font-weight:800; margin:12px 0;}
  .detail-desc{font-size:14px; color:var(--text-soft); line-height:1.7; margin-bottom:16px;}
  .option-box{border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:16px; background:#fbfaf5;}
  .option-box label{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; color:var(--teal-dark);}
  .primary-btn{
    background:var(--teal); color:#fff; border:none; border-radius:12px; padding:15px 20px;

function variantInfoFor(productKey){ return VARIANT_GROUPS[productKey] || null; }
// 表示用一覧では、同じグループの2枚目以降を間引いて1枚だけ表示する
function dedupeForDisplay(list){
  const seenGroups = new Set();
  const out = [];
  for (const p of list) {
    const info = variantInfoFor(p.productKey);
    if (info) {
      if (seenGroups.has(info.groupId)) continue;
      seenGroups.add(info.groupId);
    }
    out.push(p);
  }
  return out;
}
// 商品詳細でサイズ・提供方法を選ぶために、同じグループの全メンバーを探す

  const pool = state.products.length ? state.products : state.homeProducts;
  return pool.filter(p => (variantInfoFor(p.productKey)||{}).groupId === groupId);
}

function cartSubtotal(){ return state.cart.reduce((s,i) => s + i.ordPrice * i.qty, 0); }

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => el.classList.remove('show'), 2400);
}

function isPastCutoff(){ return new Date().getHours() >= ORDER_CUTOFF_HOUR; }

async function apiGet(path){
  const res = await fetch(BACKEND_URL + path);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadStores(){
  state.loading = true; state.error = null; render();
  try {
    const data = await apiGet('/api/public/stores');
    state.stores = data.stores || [];
    // 現時点ではGAJIMARU単独運用のため、トップページの「人気メニュー」用に先読みする
    if (state.stores.length && state.homeProducts.length === 0) {
      const pd = await apiGet('/api/public/stores/' + encodeURIComponent(state.stores[0].catalogStoreId) + '/products');
      state.homeProducts = pd.products || [];
    }
  } catch (e) {
    state.error = t('loadError');
  }
  state.loading = false;
  render();
}

async function loadProducts(catalogStoreId){
  state.loading = true; state.error = null; render();
  try {
    const data = await apiGet('/api/public/stores/' + encodeURIComponent(catalogStoreId) + '/products');
    state.products = data.products || [];
  } catch (e) {
    state.error = t('loadError');
    state.products = [];
  }
  state.loading = false;
  render();
}

// 【2026-09-24・社長承認】商品の選択肢（フレーバー等・単一選択）／追加オプション（複数選択可）を
// 汎用的に扱う。Organic Soda・Coffee等の商品ごとの専用処理は書かず、product.optionsの
// selectionType（SINGLE/MULTI）だけで判定する。
function toggleProductOption(groupId, choiceId, selectionType, required){
  const current = state.selectedOptionChoices[groupId] || [];
  if (selectionType === 'SINGLE') {
    // 【2026-09-24・社長承認・ラーメンごはんオプション】required=falseのSINGLE群は
    // 「未選択」を許容する。既に選択中の同じ選択肢をもう一度押すと選択解除する。
    if (!required && current.length === 1 && current[0] === choiceId) {
      state.selectedOptionChoices[groupId] = [];
    } else {
      state.selectedOptionChoices[groupId] = [choiceId];
    }
  } else {
    state.selectedOptionChoices[groupId] = current.includes(choiceId)
      ? current.filter(id => id !== choiceId)
      : [...current, choiceId];
  }
  render();
}
// 【2026-09-24・社長承認・バケット数量選択】selectionType='QUANTITY'の選択肢は、
// 選ぶ/選ばないの二値ではなく0以上の数量を持つ（例：バケット追加 1枚+¥80）。
// 商品ごとのハードコードはせず、selectionTypeだけで汎用的に判定する。上限は
// 設けない（メニュー・既存仕様に上限の記載がないため）。
function setOptionQuantity(groupId, choiceId, qty){
  const clamped = Math.max(0, qty);
  if (!state.selectedOptionQuantities[groupId]) state.selectedOptionQuantities[groupId] = {};
  state.selectedOptionQuantities[groupId][choiceId] = clamped;
  render();
}
// 商品(p.options)と現在の選択状態から、選択済みオプションの一覧と追加料金合計を組み立てる。
// required=trueのSINGLEグループ（FLAVOR/GOKUNNUKI等）は未選択なら1番目の選択肢を自動選択
// したものとして扱う。required=false（例：ラーメンのごはん）は未選択のままにする。
// QUANTITYグループは数量×単価をpriceDeltaとして積み上げる。
// 【2026-09-24・社長承認・ラーメン酵素玄米】group_type='RICE_BROWN'は、同じ商品内の
// group_type='RICE'グループで何か選択されている場合のみ有効とする（商品ごとのハードコード
// ではなく、group_typeの組み合わせのみで判定する汎用ロジック）。
function resolveSelectedOptions(p){
  const groups = p.options || [];
  const riceGroup = groups.find(g => g.type === 'RICE');
  const riceSelected = riceGroup ? (state.selectedOptionChoices[riceGroup.groupId] || []).length > 0 : false;
  const list = [];
  for (const g of groups) {
    if (g.type === 'RICE_BROWN' && !riceSelected) continue;
    if (g.selectionType === 'QUANTITY') {
      const quantities = state.selectedOptionQuantities[g.groupId] || {};
      g.choices.forEach(choice => {
        const qty = quantities[choice.choiceId] || 0;
        if (qty <= 0) return;
        list.push({
          groupId: g.groupId, groupLabel: g.label, groupLabelEn: g.labelEn,
          choiceId: choice.choiceId, choiceLabel: choice.label, choiceLabelEn: choice.labelEn,
          priceDelta: choice.priceDelta * qty,
          quantity: qty,
        });
      });
      continue;
    }
    let selectedIds = state.selectedOptionChoices[g.groupId];
    if ((!selectedIds || selectedIds.length === 0) && g.selectionType === 'SINGLE' && g.required && g.choices.length) {
      selectedIds = [g.choices[0].choiceId];
    }
    (selectedIds || []).forEach(id => {
      const choice = g.choices.find(c => c.choiceId === id);
      if (!choice) return;
      list.push({
        groupId: g.groupId, groupLabel: g.label, groupLabelEn: g.labelEn,
        choiceId: choice.choiceId, choiceLabel: choice.label, choiceLabelEn: choice.labelEn,
        priceDelta: choice.priceDelta,
      });
    });
  }
  const optionsTotal = list.reduce((s, o) => s + o.priceDelta, 0);
  return { list, optionsTotal };
}

function addToCart(product){
  // 【2026-09-24・社長承認】五葷抜き（Bタイプ）もフレーバー/追加オプションと同じ
  // selectedOptions構造に統合。個別の真偽値・専用キー接尾辞は廃止し、
  // 選択済みオプション（GOKUNNUKIグループ選択を含む）だけでカート明細キーを生成する。
  // 選択内容が違えば別明細（例：通常 と 五葷抜き、Organic Soda/Cola と /Ginger）になる。
  const { list: selectedOptions, optionsTotal } = resolveSelectedOptions(product);
  // 【2026-09-24・社長承認・バケット数量選択】quantityを持つ選択肢は、数量違いが
  // 別カート明細になるようoptionKeyPartに数量も含める（通常の選択肢は従来通りchoiceIdのみ）。
  const optionKeyPart = selectedOptions.length
    ? ':opt-' + [...selectedOptions].sort((a,b) => a.choiceId - b.choiceId)
        .map(o => o.quantity ? `${o.choiceId}x${o.quantity}` : String(o.choiceId))
        .join(',')
    : '';
  const key = product.productKey + optionKeyPart;
  const finalPrice = product.ordPrice + optionsTotal;
  const existing = state.cart.find(i => i.key === key);
  if (existing) existing.qty++;
  else state.cart.push({ key, productKey: product.productKey, name: product.name, nameEn: product.nameEn, ordPrice: finalPrice, imageReference: product.imageReference, selectedOptions, qty: 1 });
  const name = state.lang === 'ja' ? product.name : (product.nameEn || product.name);
  showToast('✓ ' + name);
  onCartChanged();
}
function changeQty(key, delta){
  const item = state.cart.find(i => i.key === key);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(i => i.key !== key);
  onCartChanged();
}
function removeFromCart(key){
  state.cart = state.cart.filter(i => i.key !== key);
  onCartChanged();
}

  if (!state.currentStore) { go('restaurants'); return ''; }
  const filtered = dedupeForDisplay(state.currentCategory === 'ALL' ? state.products : state.products.filter(p => p.category === state.currentCategory));
  return `
    <div class="content-with-cart" style="padding-top:24px;">
      <div class="main-col">
        <button class="detail-back" onclick="go('restaurants')">← ${t('backToRestaurants')}</button>
        <h2>${escapeHtml(state.currentStore.name)}</h2>
        ${renderCategoryStrip()}
        ${renderLoadingOrError() || `<div class="grid">${filtered.map(renderProductCard).join('')}</div>`}
      </div>
      <div>${cartPanelHtml()}</div>
    </div>
    <div class="mobile-cart-fab-slot"></div>
  `;
}

function renderProductDetail(){
  const anchor = state.currentProduct;
  if (!anchor) { go('restaurants'); return ''; }
  const variantInfo = variantInfoFor(anchor.productKey);
  const siblings = variantInfo ? findSiblingVariants(variantInfo.groupId) : [];
  const p = variantInfo ? (siblings.find(s => s.productKey === state.selectedVariantKey) || anchor) : anchor;

  const name = variantInfo ? (state.lang === 'ja' ? variantInfo.groupName.ja : variantInfo.groupName.en) : (state.lang === 'ja' ? p.name : (p.nameEn || p.name));
  const desc = state.lang === 'ja' ? p.description : (p.descriptionEn || p.description);
  const img = p.imageReference ? `<img src="${imageUrl(p.imageReference)}" alt="${escapeHtml(name)}">` : productPlaceholderHtml(p);
  const payload = JSON.stringify(p).replace(/'/g,"&#39;");

  const badges = [];
  if (isStandaloneGokunNukiProduct(p)) badges.push(`<span class="tag peach">${escapeHtml(t('gokunNukiVersionBadge'))}</span>`);

  const variantSelectorHtml = variantInfo ? `
    <div class="option-box">
      <div style="font-weight:800; color:var(--teal-dark); font-size:13px; margin-bottom:10px;">${escapeHtml(t('chooseOption'))}</div>
      ${siblings.map(s => {
        const info = variantInfoFor(s.productKey);
        const label = state.lang === 'ja' ? info.variantLabel.ja : info.variantLabel.en;
        return `<label style="margin-bottom:8px;">
          <input type="radio" name="variantChoice" value="${s.productKey}" ${s.productKey === p.productKey ? 'checked' : ''} onchange='selectVariant("${s.productKey}")'>
          <span>${escapeHtml(label)} — ¥${s.ordPrice.toLocaleString()}</span>
        </label>`;
      }).join('')}
    </div>` : '';

  // 【2026-09-24・社長承認】フレーバー選択（単一必須）・追加オプション（複数任意）を汎用的に描画。
  // 商品ごとの専用コードは書かず、p.optionsのselectionTypeだけで分岐する。
  const { list: selectedOptions, optionsTotal } = resolveSelectedOptions(p);
  const finalPrice = p.ordPrice + optionsTotal;
  // 【2026-09-24・社長承認・ラーメン酵素玄米】RICE_BROWN群は、同じ商品のRICE群が
  // 何か選択されている場合のみ表示する（group_typeの組み合わせのみで判定、商品ごとの
  // ハードコードはしない）。
  const riceGroupForDisplay = (p.options || []).find(g => g.type === 'RICE');
  const riceSelectedForDisplay = riceGroupForDisplay ? (state.selectedOptionChoices[riceGroupForDisplay.groupId] || []).length > 0 : false;
  const optionGroupsHtml = (p.options || []).map(g => {
    if (g.type === 'RICE_BROWN' && !riceSelectedForDisplay) return '';
    const groupLabel = state.lang === 'ja' ? g.label : (g.labelEn || g.label);
    // 【2026-09-24・社長承認・バケット数量選択】selectionType='QUANTITY'は[−][数量][＋]の
    // ステッパーUIで表示する。商品ごとの専用コードではなく、selectionTypeだけで分岐する。
    if (g.selectionType === 'QUANTITY') {
      const quantities = state.selectedOptionQuantities[g.groupId] || {};
      return `<div class="option-box">
        <div style="font-weight:800; color:var(--teal-dark); font-size:13px; margin-bottom:10px;">${escapeHtml(groupLabel)}</div>
        ${g.choices.map(c => {
          const qty = quantities[c.choiceId] || 0;
          const choiceLabel = state.lang === 'ja' ? c.label : (c.labelEn || c.label);
          const priceSuffix = c.priceDelta ? ` (+¥${c.priceDelta.toLocaleString()})` : '';
          return `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span>${escapeHtml(choiceLabel)}${priceSuffix}</span>
            <div style="display:flex; align-items:center; gap:12px;">
              <button type="button" onclick='setOptionQuantity(${g.groupId}, ${c.choiceId}, ${qty - 1})' ${qty <= 0 ? 'disabled' : ''} style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:800;font-size:16px;line-height:1;">−</button>
              <span style="min-width:22px;text-align:center;font-weight:800;">${qty}</span>
              <button type="button" onclick='setOptionQuantity(${g.groupId}, ${c.choiceId}, ${qty + 1})' style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:800;font-size:16px;line-height:1;">＋</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }
    const selectedIds = state.selectedOptionChoices[g.groupId]
      || (g.selectionType === 'SINGLE' && g.required && g.choices.length ? [g.choices[0].choiceId] : []);
    const inputType = g.selectionType === 'SINGLE' ? 'radio' : 'checkbox';
    return `<div class="option-box">
      <div style="font-weight:800; color:var(--teal-dark); font-size:13px; margin-bottom:10px;">${escapeHtml(groupLabel)}</div>
      ${g.choices.map(c => {
        const checked = selectedIds.includes(c.choiceId) ? 'checked' : '';
        const choiceLabel = state.lang === 'ja' ? c.label : (c.labelEn || c.label);
        const priceSuffix = c.priceDelta ? ` +¥${c.priceDelta.toLocaleString()}` : '';
        return `<label style="margin-bottom:8px;">
          <input type="${inputType}" name="optGroup_${g.groupId}" value="${c.choiceId}" ${checked} onclick='toggleProductOption(${g.groupId}, ${c.choiceId}, "${g.selectionType}", ${g.required})'>
          <span>${escapeHtml(choiceLabel)}${priceSuffix}</span>
        </label>`;
      }).join('')}
    </div>`;
  }).join('');

  return `
    <div class="content-with-cart" style="padding-top:24px;">
      <div class="main-col">
        <button class="detail-back" onclick='go("menu", ${JSON.stringify(state.currentStore).replace(/'/g,"&#39;")})'>← ${t('backToMenu')}</button>
        <div class="detail-layout">
          <div class="detail-media">${img}</div>
          <div class="detail-info">
            <h1>${escapeHtml(name)}</h1>
            ${state.lang !== 'ja' && p.name !== name ? `<div class="en">${escapeHtml(p.name)}</div>` : ''}
            ${badges.length ? `<div class="tag-row" style="margin-bottom:6px;">${badges.join('')}</div>` : ''}
            <div class="detail-price">¥${finalPrice.toLocaleString()}</div>
            ${desc ? `<p class="detail-desc">${escapeHtml(desc)}</p>` : ''}
            ${variantSelectorHtml}
            ${optionGroupsHtml}
            <button class="primary-btn" onclick='addToCart(${payload})'>${ICONS.cartWhite} ${t('addToCart')}</button>
          </div>
        </div>
      </div>
      <div>${cartPanelHtml()}</div>
    </div>
  `;
}

}

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
