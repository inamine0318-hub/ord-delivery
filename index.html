<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ORD - Okinawa Resort Delivery</title>
<style>
:root{
  --bg:#FAF6EE;
  --card:#FFFFFF;
  --primary:#0086A8;
  --primary-dark:#00647d;
  --secondary:#F2665E;
  --text:#1F2D3A;
  --text-sub:#6B7680;
  --gold:#C9A15A;
  --border:#E7E0D2;
  --st-received:#E8A33D;
  --st-cooking:#F2665E;
  --st-delivering:#0086A8;
  --st-done:#2E9E6B;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  background:#e4ded0;
  color:var(--text);
  display:flex;justify-content:center;
  min-height:100vh;
}
#phone{
  width:100%;max-width:430px;min-height:100vh;
  background:var(--bg);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.15);
  display:flex;flex-direction:column;
}
#app{flex:1;padding-bottom:24px;}

/* ===== Header ===== */
.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;align-items:center;gap:10px;
}
.topbar .back{font-size:20px;color:var(--primary);cursor:pointer;padding:2px 6px;}
.topbar .title{font-size:17px;font-weight:700;flex:1;}
.topbar .cart-btn{position:relative;font-size:20px;cursor:pointer;}
.badge{
  position:absolute;top:-6px;right:-8px;
  background:var(--secondary);color:#fff;
  font-size:10px;font-weight:700;
  border-radius:10px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ===== Hero / Top ===== */
.hero{
  background:linear-gradient(160deg,var(--primary) 0%,#12a4b8 55%,#5cc9c2 100%);
  color:#fff;padding:34px 20px 30px;
  border-radius:0 0 28px 28px;
}
.hero .brand{font-size:13px;letter-spacing:.18em;opacity:.85;font-weight:600;}
.hero h1{font-size:26px;margin-top:8px;line-height:1.35;font-weight:800;}
.hero p{margin-top:10px;font-size:13px;opacity:.92;line-height:1.6;}
.wave{
  height:6px;width:46px;background:var(--gold);border-radius:4px;margin-top:14px;
}
.section{padding:18px 16px;}
.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.section-title .tag{
  font-size:10px;background:var(--secondary);color:#fff;
  padding:2px 8px;border-radius:20px;font-weight:700;
}

/* ===== Hotel picker ===== */
.hotel-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:12px;
  cursor:pointer;transition:transform .12s;
  display:flex;gap:12px;align-items:center;
}
.hotel-card:active{transform:scale(.98);}
.hotel-card.selected{border:2px solid var(--primary);background:#f0fbfc;}
.hotel-thumb{
  width:56px;height:56px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,var(--primary),#5cc9c2);
}
.hotel-info .name{font-weight:700;font-size:14.5px;}
.hotel-info .area{color:var(--primary);font-size:11.5px;font-weight:700;margin-top:2px;}
.hotel-info .feat{color:var(--text-sub);font-size:11.5px;margin-top:3px;}

.cta{
  display:block;width:100%;text-align:center;
  background:var(--primary);color:#fff;font-weight:700;font-size:15px;
  padding:15px;border:none;border-radius:26px;cursor:pointer;margin-top:4px;
  box-shadow:0 6px 16px rgba(15,139,156,.35);
}
.cta:active{transform:scale(.98);}
.cta.secondary{background:#fff;color:var(--primary);border:2px solid var(--primary);box-shadow:none;}
.cta[disabled]{opacity:.4;box-shadow:none;cursor:not-allowed;}
.cta.small{padding:11px;font-size:13px;border-radius:20px;}

/* ===== Store list ===== */
.store-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;cursor:pointer;display:flex;gap:12px;
}
.store-card:active{transform:scale(.98);}
.store-thumb{
  width:64px;height:64px;border-radius:12px;flex-shrink:0;font-size:26px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.store-info{flex:1;}
.store-info .name{font-weight:700;font-size:15px;}
.store-info .genre{
  display:inline-block;font-size:10.5px;color:var(--primary-dark);
  background:#e4f6f7;padding:2px 8px;border-radius:10px;margin-top:4px;font-weight:700;
}
.store-info .desc{color:var(--text-sub);font-size:12px;margin-top:5px;line-height:1.5;}
.store-info .meta{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--text-sub);}

/* ===== Menu / product ===== */
.prod-row{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;gap:10px;
}
.prod-row:active{transform:scale(.98);}
.prod-row .pname{font-weight:700;font-size:14px;}
.prod-row .pdesc{color:var(--text-sub);font-size:11.5px;margin-top:3px;line-height:1.4;}
.prod-row .pprice{color:var(--primary-dark);font-weight:800;font-size:13.5px;margin-top:6px;}
.prod-icon{
  width:46px;height:46px;border-radius:10px;flex-shrink:0;font-size:20px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}

.hero-detail{
  padding:26px 18px 22px;color:#fff;border-radius:0 0 24px 24px;
}

/* ===== 店舗イメージ（それっぽい合成シーン。実写真の代わりに配色+装飾で世界観を表現） ===== */
.photo-scene{position:relative;overflow:hidden;}
.photo-scene::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.42) 100%);
}
.photo-scene>.pcontent{position:relative;z-index:2;}
.photo-scene .deco{position:absolute;pointer-events:none;}

.scene-okinawa{background:linear-gradient(160deg,#ffb35c 0%,#e8734a 55%,#7a2f1f 100%);}
.scene-okinawa .d-sun{top:-22px;right:-12px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#ffd27a 58%,transparent 74%);opacity:.9;}
.scene-okinawa .d-steam1{bottom:14px;left:26%;width:44px;height:44px;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);filter:blur(3px);}
.scene-okinawa .d-steam2{bottom:26px;left:52%;width:30px;height:30px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);filter:blur(3px);}

.scene-vegan{background:linear-gradient(160deg,#c7ecb9 0%,#2e9e6b 55%,#123f29 100%);}
.scene-vegan .d-leaf1{top:-14px;left:-18px;width:130px;height:130px;border-radius:0 62% 0 62%;background:rgba(255,255,255,.16);transform:rotate(-12deg);}
.scene-vegan .d-leaf2{bottom:-28px;right:-14px;width:100px;height:100px;border-radius:62% 0 62% 0;background:rgba(0,0,0,.14);}
.scene-vegan .d-dot{top:22px;right:22%;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);}

.scene-halal{background:linear-gradient(160deg,#f3d08c 0%,#c9862b 55%,#5c3a10 100%);}
.scene-halal .d-lantern{top:8px;right:20px;width:24px;height:34px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.42);box-shadow:0 0 20px rgba(255,222,160,.65);}
.scene-halal .d-lanternline{top:2px;right:31px;width:2px;height:8px;background:rgba(255,255,255,.5);}
.scene-halal .d-spice{bottom:-14px;left:-14px;width:110px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.18),transparent 70%);}

.scene-cafe{background:linear-gradient(160deg,#c7edf5 0%,#0086a8 55%,#00344a 100%);}
.scene-cafe .d-sun{top:-18px;left:-16px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#ffe08a 58%,transparent 76%);opacity:.9;}
.scene-cafe .d-wave1{bottom:-8px;left:0;right:0;height:36px;background:rgba(255,255,255,.26);border-radius:50% 50% 0 0/100% 100% 0 0;}
.scene-cafe .d-wave2{bottom:-18px;left:0;right:0;height:26px;background:rgba(255,255,255,.16);border-radius:50% 50% 0 0/100% 100% 0 0;}

.scene-fusion{background:linear-gradient(160deg,#3a3550 0%,#211d30 60%,#0c0a12 100%);}
.scene-fusion .d-ring1{top:50%;left:78%;width:64px;height:64px;border:1.5px solid rgba(201,161,90,.55);border-radius:50%;transform:translate(-50%,-50%);}
.scene-fusion .d-ring2{top:50%;left:78%;width:94px;height:94px;border:1px solid rgba(201,161,90,.28);border-radius:50%;transform:translate(-50%,-50%);}
.scene-fusion .d-spark1{top:20%;left:20%;width:5px;height:5px;background:#e8cf95;border-radius:50%;box-shadow:0 0 10px 3px rgba(201,161,90,.7);}
.scene-fusion .d-spark2{top:65%;left:34%;width:4px;height:4px;background:#e8cf95;border-radius:50%;box-shadow:0 0 8px 2px rgba(201,161,90,.6);}
.qty-box{
  display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0;
}
.qty-btn{
  width:40px;height:40px;border-radius:50%;border:2px solid var(--primary);
  background:#fff;color:var(--primary);font-size:20px;font-weight:800;cursor:pointer;
}
.qty-num{font-size:22px;font-weight:800;min-width:30px;text-align:center;}

/* ===== Cart ===== */
.cart-item{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.cart-item .cname{font-weight:700;font-size:13.5px;}
.cart-item .cstore{color:var(--text-sub);font-size:11px;margin-top:2px;}
.mini-qty{display:flex;align-items:center;gap:8px;}
.mini-qty button{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;
  font-size:14px;cursor:pointer;color:var(--primary);
}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;}
.summary-row.total{font-weight:800;font-size:16px;border-top:1px dashed var(--border);margin-top:8px;padding-top:14px;color:var(--primary-dark);}

/* ===== Form ===== */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-sub);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:14.5px;font-family:inherit;background:#fff;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.hotel-chip{
  display:flex;align-items:center;gap:10px;background:#f0fbfc;border:1.5px solid var(--primary);
  border-radius:14px;padding:12px 14px;margin-bottom:18px;
}
.hotel-chip .ic{font-size:22px;}
.hotel-chip .hn{font-weight:700;font-size:13.5px;}
.hotel-chip .ha{font-size:11px;color:var(--primary-dark);}

/* ===== Confirm / Order number ===== */
.order-hero{
  text-align:center;padding:38px 20px 24px;
  background:linear-gradient(160deg,var(--primary),#5cc9c2);color:#fff;
  border-radius:0 0 28px 28px;
}
.order-hero .ok-circle{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;
}
.order-no{
  font-size:20px;font-weight:800;letter-spacing:.04em;margin-top:8px;
}
.receipt{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin:16px;
}
.receipt .line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--text-sub);}
.receipt .line b{color:var(--text);}

/* ===== Status ===== */
.status-hero{padding:26px 18px;text-align:center;}
.status-badge{
  display:inline-block;padding:8px 22px;border-radius:24px;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 6px 14px rgba(0,0,0,.12);
}
.timeline{padding:8px 24px 4px;position:relative;}
.tl-step{display:flex;gap:14px;padding:14px 0;position:relative;}
.tl-dot{
  width:30px;height:30px;border-radius:50%;background:#e2e6e8;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1;
  transition:background .3s;
}
.tl-step.done .tl-dot{background:var(--st-done);}
.tl-step.active .tl-dot{background:var(--primary);box-shadow:0 0 0 5px rgba(15,139,156,.18);}
.tl-line{
  position:absolute;left:29px;top:38px;bottom:-14px;width:2px;background:#e2e6e8;
}
.tl-step.done .tl-line{background:var(--st-done);}
.tl-step:last-child .tl-line{display:none;}
.tl-text .tt{font-weight:700;font-size:13.5px;}
.tl-text .ts{font-size:11px;color:var(--text-sub);margin-top:2px;}
.map-mock{
  margin:16px;height:150px;border-radius:var(--radius);
  background:linear-gradient(135deg,#cdeef0,#a9dfe4);
  display:flex;align-items:center;justify-content:center;color:var(--primary-dark);
  font-size:13px;font-weight:700;position:relative;overflow:hidden;
}
.map-mock .bike{position:absolute;font-size:22px;animation:driveby 3.2s linear infinite;}
@keyframes driveby{0%{left:8%;}100%{left:82%;}}

.empty{text-align:center;padding:60px 24px;color:var(--text-sub);}
.empty .ic{font-size:44px;margin-bottom:14px;}

.bottombar{
  position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:12px 16px;display:flex;gap:10px;align-items:center;
}
.bottombar .price{font-weight:800;font-size:16px;color:var(--primary-dark);flex-shrink:0;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:14px;}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--border);
  font-size:12px;font-weight:700;color:var(--text-sub);cursor:pointer;
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="phone"><div id="app"></div></div>

// ---------- State ----------
const state = {
  screen:'top',
  hotel:null,
  room:'',
  roomType:'',
  guestName:'',
  note:'',
  activeStoreId:null,
  activeProductId:null,
  activeGenreFilter:'すべて',
  cart:[], // {storeId, productId, qty}
  order:null, // {no, items, total, hotel, room, createdAt, statusIndex}
};

function goTo(screen){ state.screen = screen; render(); scrollToTop(); }
function scrollToTop(){ const app=document.getElementById('app'); if(app) app.scrollTop=0; window.scrollTo(0,0); }

function getStore(id){ return STORES.find(s=>s.id===id); }
function getProduct(storeId,pid){ const s=getStore(storeId); return s&&s.menu.find(p=>p.id===pid); }

function cartCount(){ return state.cart.reduce((sum,c)=>sum+c.qty,0); }
function cartTotal(){ return state.cart.reduce((sum,c)=>{ const p=getProduct(c.storeId,c.productId); return sum + (p?p.price*c.qty:0); },0); }
function cartStoreId(){ return state.cart.length ? state.cart[0].storeId : null; }

function addToCart(storeId, productId, qty){
  // 単一店舗のみカート保持（別店舗を追加しようとしたらカートをリセットする設計）
  if(cartStoreId() && cartStoreId()!==storeId){
    if(!confirm('カート内は別店舗の商品です。カートを空にして新しい店舗の商品を追加しますか？')) return;
    state.cart = [];
  }
  const existing = state.cart.find(c=>c.storeId===storeId && c.productId===productId);
  if(existing) existing.qty += qty; else state.cart.push({storeId, productId, qty});
}
function setQty(storeId, productId, qty){
  const item = state.cart.find(c=>c.storeId===storeId && c.productId===productId);
  if(!item) return;
  item.qty = qty;
  if(item.qty<=0) state.cart = state.cart.filter(c=>c!==item);
  render();
}

function formatYen(n){ return '¥' + n.toLocaleString(); }

// ---------- 店舗イメージ（実写真の代わりのCSS合成シーン、試作用） ----------
const SCENE_CLASS = {s1:'scene-okinawa', s2:'scene-vegan', s3:'scene-halal', s4:'scene-cafe', s5:'scene-fusion'};
const SCENE_DECO = {
  'scene-okinawa': '<div class="deco d-sun"></div><div class="deco d-steam1"></div><div class="deco d-steam2"></div>',
  'scene-vegan': '<div class="deco d-leaf1"></div><div class="deco d-leaf2"></div><div class="deco d-dot"></div>',
  'scene-halal': '<div class="deco d-lantern"></div><div class="deco d-lanternline"></div><div class="deco d-spice"></div>',
  'scene-cafe': '<div class="deco d-sun"></div><div class="deco d-wave1"></div><div class="deco d-wave2"></div>',
  'scene-fusion': '<div class="deco d-ring1"></div><div class="deco d-ring2"></div><div class="deco d-spark1"></div><div class="deco d-spark2"></div>',
};
function sceneClassOf(storeId){ return SCENE_CLASS[storeId] || 'scene-okinawa'; }
function sceneDeco(storeId){ return SCENE_DECO[sceneClassOf(storeId)] || ''; }

function makeOrderNo(){
  const d = new Date();
  const ymd = d.getFullYear().toString() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = String(Math.floor(Math.random()*900)+100);
  return `ORD-${ymd}-${rand}`;
}

function placeOrder(){
  const store = getStore(cartStoreId());
  state.order = {
    no: makeOrderNo(),
    items: state.cart.map(c=>({...c, product:getProduct(c.storeId,c.productId)})),
    total: cartTotal(),
    hotel: state.hotel,
    room: state.room,
    roomType: state.roomType,
    storeName: store ? store.name : '',
    createdAt: new Date(),
    statusIndex: 0,
  };
  state.cart = [];
  goTo('confirm');
}

// ステータス自動進行（デモ用：数秒おきに次のステータスへ進める）
let statusTimer = null;
function startStatusAutoAdvance(){
  clearInterval(statusTimer);
  statusTimer = setInterval(()=>{
    if(!state.order) { clearInterval(statusTimer); return; }
    if(state.order.statusIndex < STATUS_STEPS.length-1){
      state.order.statusIndex++;
      if(state.screen==='status') render();
    } else {
      clearInterval(statusTimer);
    }
  }, 4000);
}

  const back = opts.back!==false ? `<span class="back" onclick="${opts.backTo?`goTo('${opts.backTo}')`:'history.back()'}">‹</span>` : '<span style="width:26px"></span>';
  const cart = opts.hideCart ? '' : `<span class="cart-btn" onclick="goTo('cart')">🛒${cartCount()>0?`<span class="badge">${cartCount()}</span>`:''}</span>`;
  return `<div class="topbar">${back}<div class="title">${title}</div>${cart}</div>`;
}

        <div class="line"><span>お届け先</span><b>${o.hotel.name} ${o.room}号室</b></div>
        <div class="line"><span>ご注文店舗</span><b>${o.storeName}</b></div>
        <div class="line"><span>合計金額</span><b>${formatYen(o.total+300)}</b></div>
      </div>
      ${o.statusIndex>=STATUS_STEPS.length-1 ? `<button class="cta" onclick="goTo('top')">またのご利用をお待ちしております</button>` : `<div style="text-align:center;font-size:11.5px;color:var(--text-sub);">数秒ごとに自動更新されます（デモ用シミュレーション）</div>`}
    </div>
  `;
}

function renderEmpty(icon,msg,to,label){
  return `<div class="empty"><div class="ic">${icon}</div><div>${msg}</div><button class="cta" style="margin-top:20px;" onclick="goTo('${to}')">${label||'戻る'}</button></div>`;
}

const SCREENS = {
  top: renderTop,
  storeList: renderStoreList,
  storeDetail: renderStoreDetail,
  productDetail: renderProductDetail,
  cart: renderCart,
  delivery: renderDelivery,
  reviewOrder: renderReviewOrder,
  confirm: renderConfirm,
  status: renderStatus,
};

function render(){
  const app = document.getElementById('app');
  const fn = SCREENS[state.screen] || renderTop;
  app.innerHTML = fn();
}

render();
</script>
</body>
</html>
